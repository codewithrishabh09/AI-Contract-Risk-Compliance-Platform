name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16

        env:
          POSTGRES_DB: contract_intelligence_test
          POSTGRES_USER: contract_admin
          POSTGRES_PASSWORD: contract_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U contract_admin -d contract_intelligence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: testing

      DATABASE_URL: postgresql+psycopg://contract_admin:contract_password@localhost:5432/contract_intelligence_test

      REDIS_URL: redis://localhost:6379/1

      JWT_SECRET_KEY: ci-test-secret-change-me

      JWT_ALGORITHM: HS256

      JWT_EXPIRE_MINUTES: 30

      CORS_ORIGINS: http://localhost:5173

      STORAGE_PROVIDER: local

      STORAGE_ROOT: /tmp/contract-storage

      LLM_PROVIDER: openai

      LLM_MODEL: gpt-4.1-mini

      OPENAI_API_KEY: test-key

      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2

      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: server
        run: |
          alembic upgrade head

      - name: Run tests
        working-directory: server
        run: |
          pytest -v


  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: ai-contract-intelligence:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
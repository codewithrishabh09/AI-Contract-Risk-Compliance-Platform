services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: contract-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: contract_intelligence
      POSTGRES_USER: contract_admin
      POSTGRES_PASSWORD: contract_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U contract_admin -d contract_intelligence"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: contract-redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    volumes:
      - redis_data:/data

    ports:
      - "6379:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: contract-api
    restart: unless-stopped

    env_file:
      - ./server/.env.docker

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - contract_storage:/app/storage


  worker:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: contract-worker
    restart: unless-stopped

    env_file:
      - ./server/.env.docker

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      [
        "celery",
        "-A",
        "app.celery_app.celery_app",
        "worker",
        "--loglevel=info"
      ]

    volumes:
      - contract_storage:/app/storage


volumes:
  postgres_data:
  redis_data:
  contract_storage: